server:
  port: 9093

spring:
  application:
    name: tickets
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/ticket-service-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  cloud:
    function:
      definition: bookingEventProcessor;paymentConfirmationProcessor
    stream:
      default-binder: kafka
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true
          producer-properties:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
      bindings:
        bookingEventProcessor-in-0:
          destination: booking-events-topic,booking-canceled-topic
          group: booking-ticket-service-group
          content-type: application/json
        bookingEventProcessor-out-0:
          destination: ticket-events-topic
          content-type: application/json
        paymentConfirmationProcessor-in-0:
          content-type: application/json
          destination: payment-events-topic
          group: payment-ticket-service-group
        paymentConfirmationProcessor-out-0:
          destination: payment-ticket-events-topic
          content-type: application/json

