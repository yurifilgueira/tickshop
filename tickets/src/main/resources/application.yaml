server:
  port: 9093

spring:
  application:
    name: tickets
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/ticket-service-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  cloud:
    function:
      definition: bookingEventProcessor
    stream:
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true
        bindings:
          bookingEventProcessor-out-0:
            producer:
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
      default:
        contentType: application/json
      bindings:
        bookingEventProcessor-in-0:
          destination: booking-events-topic
          group: ticket-service-group
        bookingEventProcessor-out-0:
          destination: ticket-events-topic

